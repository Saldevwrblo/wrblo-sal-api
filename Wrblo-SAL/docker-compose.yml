
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: myapplication-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=sal_api;
        Username=wrblo_sal;
        Password=${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    container_name: myapplication-postgres

    environment:
      POSTGRES_DB: myapplication
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d myapplication"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
